<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 550px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
            color: #222;
        }
        h1 {
            color: #0a4d8c;
        }
        button {
            padding: 10px 18px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #0a4d8c;
            color: white;
        }
        button:hover {
            background: #07386a;
        }
        #randomNumber {
            font-weight: bold;
            color: #d14e4e;
        }
    </style>
</head>
<body>
    <h1>Java random number generator</h1>
    <p>Random number between 1 and 100: <span id="randomNumber">--</span></p>
    <button onclick="generateRandomNumber()">Generate Random Number</button>
    <script>
        function generateRandomNumber() {
            const min = 1;
            const max = 100;
            const randomNumber = Math.floor(Math.random() * (max - min + 1)) + min;
            document.getElementById('randomNumber').textContent = randomNumber;
        }
    </script>
</body>
</html>
